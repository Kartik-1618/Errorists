<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/> <!-- stdDeviation is how much to blur -->
      <feOffset dx="2" dy="2" result="offsetblur"/> <!-- how much to offset -->
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/> <!-- opacity of shadow -->
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/> <!-- this contains the offset blurred image -->
        <feMergeNode in="SourceGraphic"/> <!-- this contains the element that the filter is applied to -->
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main Road Path (The S shape) -->
  <path d="M 35 85 C 10 85, 10 55, 40 50 C 70 45, 80 35, 75 15" 
        stroke="url(#grad1)" 
        stroke-width="22" 
        fill="none" 
        stroke-linecap="round"
        filter="url(#dropShadow)" />

  <!-- Road Markings (Dashed Line) -->
  <path d="M 35 85 C 10 85, 10 55, 40 50 C 70 45, 80 35, 75 15" 
        stroke="white" 
        stroke-width="2" 
        fill="none" 
        stroke-dasharray="4,6"
        stroke-opacity="0.8" />

  <!-- Arrow Head -->
  <path d="M 60 15 L 90 5 L 90 35 Z" 
        fill="url(#grad1)" 
        transform="rotate(-15 80 20)"
        filter="url(#dropShadow)" />
        
</svg>
